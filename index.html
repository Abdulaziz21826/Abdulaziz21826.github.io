
<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="robots" content="noindex, nofollow">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EVA PHARMA — Corridor Container Tracker</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Camera QR Scanner -->

<body class="bg-white text-slate-800 font-sans p-4 min-h-screen relative overflow-x-hidden">

         onerror="this.remove();">

    <!-- Company header -->

        <img id="companyLogo" src="eva-pharma-logo.png" alt="EVA PHARMA" class="h-40 w-auto"
             onerror="this.onerror=null; this.replaceWith(Object.assign(document.createElement('span'), {textContent:'EVA PHARMA', className:'text-lg font-extrabold tracking-wide text-[#0B1B33]'}));">
        <span class="text-[10px] font-semibold uppercase tracking-wider text-[#8a6708] bg-[#F2B429]/15 border border-[#F2B429]/50 px-2.5 py-1 rounded-full">Corridor Tracker</span>
    </div>

    <div class="max-w-md mx-auto bg-[#F5F3EF] rounded-2xl shadow-xl p-6 space-y-4 relative z-10">
        <h1 class="text-xl font-bold text-[#0B1B33] border-b border-[#0B1B33]/10 pb-2">Corridor Container Tracker</h1>

        <!-- Connection status -->
        <div id="connStatus" class="text-xs text-center py-1.5 rounded-md bg-slate-100 text-slate-500">
            Connecting to shared database...
        </div>

        <!-- Camera Scanner Area -->
        <div class="bg-white p-3 rounded-lg border border-slate-200">

            <p id="scan-status" class="text-xs text-slate-500 text-center mt-1 hidden"></p>

                📷 Open Camera / Scan Container QR

            <button id="stop-scan-btn" onclick="stopScanner()" class="w-full mt-2 bg-rose-600 text-white font-medium py-2 rounded-md hidden">
                Stop Camera

        </div>

        <!-- Inputs Form -->
        <div class="space-y-3">
            <div>
                <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">1. Select Zone</label>
                <select id="zoneSelect" class="w-full p-2.5 bg-white border border-slate-300 rounded-md focus:outline-[#F2B429] font-medium text-slate-700">
                    <option value="" disabled selected>Loading zones...</option>

                <p id="zoneHint" class="text-[11px] text-slate-400 mt-1"></p>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">2. Batch Number</label>
                <input type="text" id="batchInput" placeholder="Scan or enter Batch Number" class="w-full p-2 border border-slate-300 rounded-md focus:outline-[#F2B429]">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">3. Container Number</label>

            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">4. Personnel Name / ID</label>
                <input type="text" id="operatorInput" placeholder="Personnel ID or Name" class="w-full p-2 border border-slate-300 rounded-md focus:outline-[#F2B429]">
            </div>

            <button id="confirmBtn" onclick="logMovement()" class="w-full bg-[#F2B429] text-[#0B1B33] font-bold py-2.5 rounded-full hover:bg-[#e0a71f] transition shadow">
                Confirm & Log Container
            </button>
        </div>

        <!-- Zone occupancy overview -->
        <div class="pt-4 border-t border-slate-200">
            <div class="flex justify-between items-center mb-2">
                <h2 class="text-md font-semibold text-[#0B1B33]">Zone Availability</h2>
                <button onclick="resetAllZones()" class="text-xs bg-[#F2B429]/15 hover:bg-[#F2B429]/25 text-[#8a6708] font-medium px-2 py-1 rounded transition">↺ Reset All Zones</button>
            </div>
            <p class="text-[10px] text-slate-400 mb-1.5">Tap an occupied pallet to release it.</p>
            <div id="zoneOverview" class="space-y-2 text-xs"></div>
        </div>

        <!-- Move / Relocate a batch -->
        <div class="pt-4 border-t border-slate-200">
            <h2 class="text-md font-semibold text-[#0B1B33] mb-2">🔀 Move / Relocate a Batch</h2>
            <div class="space-y-2 bg-[#0B1B33]/5 border border-[#0B1B33]/10 rounded-md p-3">
                <div>
                    <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Currently Tracked Item</label>
                    <select id="moveSourceSelect" onchange="onMoveSourceChange()" class="w-full p-2 bg-white border border-slate-300 rounded-md text-sm focus:outline-[#F2B429]">
                        <option value="" disabled selected>-- Select batch/container to move --</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Destination Zone</label>
                    <select id="moveZoneSelect" onchange="renderMovePalletOptions()" class="w-full p-2 bg-white border border-slate-300 rounded-md text-sm focus:outline-[#F2B429]">
                        <option value="" disabled selected>-- Choose Zone --</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Destination Pallet</label>
                    <select id="movePalletSelect" class="w-full p-2 bg-white border border-slate-300 rounded-md text-sm focus:outline-[#F2B429]">
                        <option value="" disabled selected>-- Choose Pallet --</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Personnel Name / ID</label>
                    <input type="text" id="moveOperatorInput" placeholder="Personnel ID or Name" class="w-full p-2 border border-slate-300 rounded-md text-sm focus:outline-[#F2B429]">
                </div>
                <button id="moveBtn" onclick="moveBatch()" class="w-full bg-[#0B1B33] text-white font-bold py-2.5 rounded-full hover:bg-[#132644] transition shadow">
                    Confirm Move
                </button>
            </div>
        </div>

        <!-- Search by Batch -->
        <div class="pt-4 border-t border-slate-200">
            <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Search Batch → Last Known Zone</label>
            <input type="text" id="searchBatchInput" oninput="searchBatch()" placeholder="Type or scan a Batch Number..." class="w-full p-2 border border-slate-300 rounded-md focus:outline-[#F2B429]">
            <div id="searchResult" class="mt-2 hidden"></div>
        </div>

        <!-- Recent Logs Table -->
        <div class="pt-4 border-t border-slate-200">
            <div class="flex justify-between items-center mb-2 flex-wrap gap-1">
                <h2 class="text-md font-semibold text-[#0B1B33]">Recent Movements</h2>
                <div class="space-x-1">
                    <button onclick="exportPDF()" class="text-xs bg-red-600 hover:bg-red-700 text-white font-medium px-2.5 py-1 rounded shadow transition">📄 PDF (last 300)</button>
                    <button onclick="exportCSV()" class="text-xs bg-slate-200 hover:bg-slate-300 px-2 py-1 rounded text-slate-700">CSV (last 300)</button>
                </div>
            </div>
            <div class="flex justify-end gap-1 mb-2">
                <button id="fullHistoryPdfBtn" onclick="fullHistoryExportPDF()" class="text-xs bg-[#0B1B33] hover:bg-[#132644] text-white font-medium px-2.5 py-1 rounded shadow transition">📚 Full History (PDF)</button>
                <button id="fullHistoryCsvBtn" onclick="fullHistoryExportCSV()" class="text-xs bg-[#0B1B33]/10 hover:bg-[#0B1B33]/20 text-[#0B1B33] font-medium px-2.5 py-1 rounded transition">Full History (CSV)</button>
            </div>
            <div class="max-h-52 overflow-y-auto border border-slate-200 rounded">
                <table class="w-full text-xs text-left text-slate-600">
                    <thead class="bg-slate-100 text-slate-700 sticky top-0">
                        <tr>
                            <th class="p-2">Type</th>
                            <th class="p-2">Batch</th>
                            <th class="p-2">Container</th>
                            <th class="p-2">Zone</th>
                            <th class="p-2">Pallet</th>
                            <th class="p-2">Details</th>
                            <th class="p-2">Time</th>
                        </tr>
                    </thead>
                    <tbody id="logTableBody">
                        <!-- Log entries load here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // =====================================================================
        // FIREBASE SETUP — paste your own config object below.
        // Get it from: Firebase Console → Project Settings → Your apps → Web app
        // =====================================================================
        const firebaseConfig = {
            apiKey: "AIzaSyASrlD1uJsfpKW8kFC_4xNG8a5G4w6-UT0",
            authDomain: "batch-tracker-v2.firebaseapp.com",
            projectId: "batch-tracker-v2",
            storageBucket: "batch-tracker-v2.firebasestorage.app",
            messagingSenderId: "959576555579",
            appId: "1:959576555579:web:3c6f12749740186cac9c1e"
        };

        const ZONE_NAMES = ['Zone A', 'Zone B', 'Zone C', 'Zone D', 'Zone E', 'Zone F'];
        const PALLETS_PER_ZONE = 4;

        let db;
        let zonesData = {};   // { "Zone A": { pallets: [false,false,true,false] }, ... }
        let occupancyData = {}; // { occKey: {batch, container, zone, palletNumber} } — who's in every slot, live
        let logs = [];        // movements, newest first
        let html5QrCode;

        function initFirebase() {
            try {
                firebase.initializeApp(firebaseConfig);
                db = firebase.firestore();
                setConnStatus('Connected — data is live and shared with all devices', 'ok');
                ensureZonesExist();
                listenToZones();
                listenToMovements();
                listenToOccupancy();
            } catch (err) {
                setConnStatus('Setup needed: paste your Firebase config in the code (see comments).', 'error');
                console.error(err);
            }
        }

        function setConnStatus(text, type) {
            const el = document.getElementById('connStatus');
            el.textContent = text;
            el.className = 'text-xs text-center py-1.5 rounded-md ' +
                (type === 'ok' ? 'bg-emerald-50 text-emerald-600'
                 : type === 'error' ? 'bg-rose-50 text-rose-600'
                 : 'bg-slate-100 text-slate-500');
        }

        // Create the 6 zone documents the first time the app ever runs.
        // Safe to call repeatedly — it only creates what's missing.
        async function ensureZonesExist() {
            try {
                for (const zoneName of ZONE_NAMES) {
                    const ref = db.collection('zones').doc(zoneName);
                    const snap = await ref.get();
                    const data = snap.data();
                    if (!snap.exists || !Array.isArray(data.pallets) || data.pallets.length !== PALLETS_PER_ZONE) {
                        // Missing doc OR malformed pallets field (e.g. edited by hand, corrupted
                        // by a bad write) — reset it to a clean empty zone rather than leaving
                        // it broken, which previously made the whole zone list vanish.
                        await ref.set({ pallets: Array(PALLETS_PER_ZONE).fill(false) }); // false = empty slot
                    }
                }
            } catch (err) {
                console.error('ensureZonesExist failed:', err);
                setConnStatus('Database error: ' + err.message + ' — check Firestore is enabled and rules allow access.', 'error');
            }
        }

        // Live-updates zonesData whenever ANY device changes a zone's pallets.
        function listenToZones() {
            db.collection('zones').onSnapshot(snapshot => {
                if (snapshot.empty) {
                    setConnStatus('No zones found in the database yet — check Firestore rules allow writes, then reload this page.', 'error');
                    return;
                }
                snapshot.forEach(doc => { zonesData[doc.id] = doc.data(); });
                renderZoneSelect();
                renderZoneOverview();
                renderMoveZoneOptions();
                if (document.getElementById('moveZoneSelect').value) renderMovePalletOptions();
                // Data arrived successfully — clear any earlier "no zones found" error
                // that may have been shown from a transient empty snapshot on load.
                setConnStatus('Connected — data is live and shared with all devices', 'ok');
            }, err => setConnStatus('Connection error: ' + err.message, 'error'));
        }

        // Live-updates the movements table on every device.
        function listenToMovements() {
            db.collection('movements').orderBy('time', 'desc').limit(300)
              .onSnapshot(snapshot => {
                logs = snapshot.docs.map(d => {
                    const data = d.data();
                    return {
                        type: data.type || 'Entry',
                        details: data.details || '',
                        batch: data.batch || '',
                        container: data.container || '',
                        zone: data.zone || '',
                        operator: data.operator || '',
                        palletNumber: data.palletNumber || '',
                        time: data.time && data.time.toDate ? data.time.toDate().toLocaleString() : 'Just now'
                    };
                });
                renderLogs();
                searchBatch();
              }, err => setConnStatus('Connection error: ' + err.message, 'error'));
        }

        // Live-updates who's occupying every pallet — powers the per-pallet batch
        // display in Zone Availability and the "Move" panel's source dropdown.
        function listenToOccupancy() {
            db.collection('occupancy').onSnapshot(snapshot => {
                occupancyData = {};
                snapshot.forEach(doc => { occupancyData[doc.id] = doc.data(); });
                renderZoneOverview();
                renderMoveSourceOptions();
            }, err => setConnStatus('Connection error: ' + err.message, 'error'));
        }

        function findOccupant(zoneName, palletNum) {
            return Object.values(occupancyData).find(o => o.zone === zoneName && o.palletNumber === palletNum);
        }

        // ---------- Zone dropdown: only show zones with free pallets ----------
        function renderZoneSelect() {
            const select = document.getElementById('zoneSelect');
            const previousValue = select.value;
            select.innerHTML = '';

            const placeholder = document.createElement('option');
            placeholder.value = '';
            placeholder.disabled = true;
            placeholder.textContent = '-- Choose Zone --';
            select.appendChild(placeholder);

            let anyAvailable = false;

            ZONE_NAMES.forEach(zoneName => {
                const zone = zonesData[zoneName];
                if (!zone || !Array.isArray(zone.pallets)) {
                    if (zone) console.warn(`Zone "${zoneName}" has malformed pallets data:`, zone.pallets);
                    return;
                }
                const free = zone.pallets.filter(p => p === false).length;
                if (free > 0) {
                    anyAvailable = true;
                    const opt = document.createElement('option');
                    opt.value = zoneName;
                    opt.textContent = `${zoneName} (${free} pallet${free > 1 ? 's' : ''} free)`;
                    select.appendChild(opt);
                }
                // Zones with 0 free pallets are simply not added — they "disappear".
            });

            placeholder.selected = true;
            if (previousValue && Array.from(select.options).some(o => o.value === previousValue)) {
                select.value = previousValue;
            }

            const hint = document.getElementById('zoneHint');
            const confirmBtn = document.getElementById('confirmBtn');
            if (!anyAvailable) {
                hint.textContent = 'All zones are currently full.';
                confirmBtn.disabled = true;
                confirmBtn.classList.add('opacity-50', 'cursor-not-allowed');
            } else {
                hint.textContent = '';
                confirmBtn.disabled = false;
                confirmBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            }
        }

        // ---------- Zone overview: per-pallet grid showing batch numbers ----------
        function renderZoneOverview() {
            const container = document.getElementById('zoneOverview');
            container.innerHTML = '';
            ZONE_NAMES.forEach(zoneName => {
                const zone = zonesData[zoneName];
                const panel = document.createElement('div');

                if (!zone || !Array.isArray(zone.pallets)) {
                    // Malformed or missing doc — show it instead of silently dropping it,
                    // so the whole overview doesn't vanish because of one bad zone.
                    if (zone) console.warn(`Zone "${zoneName}" has malformed pallets data:`, zone.pallets);
                    panel.className = 'p-2 rounded-md border bg-amber-50 border-amber-200 text-amber-700';
                    panel.innerHTML = `<div class="font-semibold">${zoneName} — Data error</div>`;
                    container.appendChild(panel);
                    return;
                }

                const free = zone.pallets.filter(p => p === false).length;
                const isFull = free === 0;

                let slotsHtml = '';
                for (let i = 0; i < PALLETS_PER_ZONE; i++) {
                    const palletNum = i + 1;
                    const occupied = zone.pallets[i];
                    const occ = occupied ? findOccupant(zoneName, palletNum) : null;
                    const label = occupied ? (occ ? escapeHtml(occ.batch) : '⚠ unknown') : 'Empty';
                    const clickAttr = occupied ? ` onclick="releaseSpecificPallet('${zoneName.replace(/'/g, "\\'")}', ${palletNum})"` : '';
                    slotsHtml += `
                        <div class="p-1.5 rounded text-center border ${
                            occupied ? 'bg-rose-50 border-rose-200 text-rose-700 cursor-pointer hover:bg-rose-100' : 'bg-emerald-50 border-emerald-100 text-emerald-500'
                        }" title="${occupied ? 'Tap to release this pallet' : 'Empty'}"${clickAttr}>
                            <div class="text-[9px] opacity-70">P${palletNum}</div>
                            <div class="font-medium truncate">${label}</div>
                        </div>`;
                }

                panel.className = 'p-2 rounded-md border bg-slate-50 border-slate-200';
                panel.innerHTML = `
                    <div class="flex justify-between items-center mb-1">
                        <span class="font-semibold text-slate-700">${zoneName}</span>
                        <span class="text-[10px] font-medium ${isFull ? 'text-rose-600' : 'text-emerald-600'}">${isFull ? 'FULL' : free + ' / ' + PALLETS_PER_ZONE + ' free'}</span>
                    </div>
                    <div class="grid grid-cols-4 gap-1">${slotsHtml}</div>
                `;
                container.appendChild(panel);
            });
        }

        // ---------- Reset every zone back to empty (clears the stuck backlog) ----------
        async function resetAllZones() {
            const confirmed = confirm(
                'This will mark EVERY pallet in EVERY zone as empty and clear all current occupancy tracking.\n\n' +
                'Use this once to clear zones stuck full from before the auto-release fix. It does NOT delete the movement history/logs.\n\n' +
                'Continue?'
            );
            if (!confirmed) return;

            const releasedBy = prompt('Your name / ID (for the reset record):') || 'Unknown';

            try {
                // Log a Release event for everything that was occupied, BEFORE wiping it,
                // so the audit trail shows exactly what was cleared and when.
                const occSnap = await db.collection('occupancy').get();
                if (!occSnap.empty) {
                    const logBatch = db.batch();
                    occSnap.forEach(doc => {
                        const occ = doc.data();
                        const logRef = db.collection('movements').doc();
                        logBatch.set(logRef, {
                            type: 'Release', details: `Cleared by bulk "Reset All Zones"`,
                            batch: occ.batch || '', container: occ.container || '', zone: occ.zone || '',
                            operator: releasedBy, palletNumber: occ.palletNumber || '',
                            time: firebase.firestore.FieldValue.serverTimestamp()
                        });
                    });
                    await logBatch.commit();
                }

                const batchOp = db.batch();
                ZONE_NAMES.forEach(zoneName => {
                    const ref = db.collection('zones').doc(zoneName);
                    batchOp.set(ref, { pallets: Array(PALLETS_PER_ZONE).fill(false) });
                });
                await batchOp.commit();

                // Clear occupancy tracking too, since those slots no longer exist.
                if (!occSnap.empty) {
                    const delBatch = db.batch();
                    occSnap.forEach(doc => delBatch.delete(doc.ref));
                    await delBatch.commit();
                }

                alert('All zones have been reset to empty.');
            } catch (err) {
                alert('Could not reset zones: ' + err.message);
            }
        }

        // ---------- Release a specific pallet slot (container physically left) ----------
        async function releaseSpecificPallet(zoneName, palletNum) {
            const occ = findOccupant(zoneName, palletNum);
            const label = occ ? `${occ.batch} / ${occ.container}` : `Pallet ${palletNum}`;
            if (!confirm(`Release ${label} from ${zoneName}, Pallet ${palletNum}?`)) return;

            const releasedBy = prompt('Your name / ID (for the release record):') || 'Unknown';

            try {
                await db.runTransaction(async (t) => {
                    const zoneRef = db.collection('zones').doc(zoneName);
                    const zoneDoc = await t.get(zoneRef);
                    if (!zoneDoc.exists) throw new Error('Zone not found');
                    const pallets = zoneDoc.data().pallets;
                    if (!pallets[palletNum - 1]) throw new Error('Pallet is already empty.');
                    pallets[palletNum - 1] = false;
                    t.update(zoneRef, { pallets });
                });

                // Find who was occupying this exact slot, so the release record shows
                // which batch/container left — then clean up its occupancy record.
                const occSnap = await db.collection('occupancy')
                    .where('zone', '==', zoneName)
                    .where('palletNumber', '==', palletNum)
                    .get();

                if (occSnap.empty) {
                    await db.collection('movements').add({
                        type: 'Release', details: `Pallet ${palletNum} manually released (no matching entry record found)`,
                        batch: '', container: '', zone: zoneName, operator: releasedBy,
                        palletNumber: palletNum,
                        time: firebase.firestore.FieldValue.serverTimestamp()
                    });
                } else {
                    for (const doc of occSnap.docs) {
                        const o = doc.data();
                        await db.collection('movements').add({
                            type: 'Release', details: `Container left ${zoneName}, Pallet ${palletNum}`,
                            batch: o.batch || '', container: o.container || '', zone: zoneName, operator: releasedBy,
                            palletNumber: palletNum,
                            time: firebase.firestore.FieldValue.serverTimestamp()
                        });
                        await doc.ref.delete();
                    }
                }
            } catch (err) {
                alert('Could not release pallet: ' + err.message);
            }
        }

        // ---------- Move / relocate a currently tracked batch ----------
        function renderMoveSourceOptions() {
            const select = document.getElementById('moveSourceSelect');
            const previousValue = select.value;
            select.innerHTML = '<option value="" disabled selected>-- Select batch/container to move --</option>';
            Object.entries(occupancyData)
                .sort((a, b) => (a[1].batch || '').localeCompare(b[1].batch || ''))
                .forEach(([key, occ]) => {
                    const opt = document.createElement('option');
                    opt.value = key;
                    opt.textContent = `${occ.batch} / ${occ.container} — in ${occ.zone}, Pallet ${occ.palletNumber}`;
                    select.appendChild(opt);
                });
            if (previousValue && Array.from(select.options).some(o => o.value === previousValue)) {
                select.value = previousValue;
            }
        }

        function renderMoveZoneOptions() {
            const select = document.getElementById('moveZoneSelect');
            const previousValue = select.value;
            select.innerHTML = '<option value="" disabled selected>-- Choose Zone --</option>';
            ZONE_NAMES.forEach(zoneName => {
                const zone = zonesData[zoneName];
                const free = zone && Array.isArray(zone.pallets) ? zone.pallets.filter(p => p === false).length : 0;
                const opt = document.createElement('option');
                opt.value = zoneName;
                opt.textContent = `${zoneName} (${free} free)`;
                select.appendChild(opt);
            });
            if (previousValue && Array.from(select.options).some(o => o.value === previousValue)) {
                select.value = previousValue;
            }
        }

        function renderMovePalletOptions() {
            const zoneName = document.getElementById('moveZoneSelect').value;
            const palletSelect = document.getElementById('movePalletSelect');
            palletSelect.innerHTML = '<option value="" disabled selected>-- Choose Pallet --</option>';
            const zone = zonesData[zoneName];
            if (!zone || !Array.isArray(zone.pallets)) return;
            zone.pallets.forEach((occupied, i) => {
                if (!occupied) {
                    const opt = document.createElement('option');
                    opt.value = i + 1;
                    opt.textContent = `Pallet ${i + 1}`;
                    palletSelect.appendChild(opt);
                }
            });
            if (palletSelect.options.length <= 1) {
                const opt = document.createElement('option');
                opt.disabled = true;
                opt.textContent = 'No free pallets in this zone';
                palletSelect.appendChild(opt);
            }
        }

        function onMoveSourceChange() {
            document.getElementById('movePalletSelect').innerHTML = '<option value="" disabled selected>-- Choose Pallet --</option>';
        }

        async function moveBatch() {
            const occKey = document.getElementById('moveSourceSelect').value;
            const destZone = document.getElementById('moveZoneSelect').value;
            const destPalletRaw = document.getElementById('movePalletSelect').value;
            const operator = document.getElementById('moveOperatorInput').value.trim();

            if (!occKey || !destZone || !destPalletRaw || !operator) {
                alert('Please fill in all fields before moving.');
                return;
            }
            const destPallet = parseInt(destPalletRaw, 10);

            const moveBtn = document.getElementById('moveBtn');
            moveBtn.disabled = true;
            moveBtn.textContent = 'Moving...';

            try {
                let batch = '', container = '', prevZone = '', prevPallet = null;

                await db.runTransaction(async (t) => {
                    const occRef = db.collection('occupancy').doc(occKey);
                    const occDoc = await t.get(occRef);
                    if (!occDoc.exists) throw new Error('This item is no longer tracked (it may have already moved or been released). Please refresh and try again.');
                    const occ = occDoc.data();
                    batch = occ.batch; container = occ.container; prevZone = occ.zone; prevPallet = occ.palletNumber;

                    if (prevZone === destZone && prevPallet === destPallet) {
                        throw new Error('That is already its current location.');
                    }

                    const sameZone = (prevZone === destZone);
                    const destZoneRef = db.collection('zones').doc(destZone);
                    const destZoneDoc = await t.get(destZoneRef);
                    if (!destZoneDoc.exists) throw new Error('Destination zone not found.');

                    const prevZoneRef = sameZone ? destZoneRef : db.collection('zones').doc(prevZone);
                    const prevZoneDoc = sameZone ? destZoneDoc : await t.get(prevZoneRef);

                    const destPallets = destZoneDoc.data().pallets;
                    if (destPallets[destPallet - 1]) throw new Error('That destination pallet just became occupied by someone else. Please choose another.');

                    destPallets[destPallet - 1] = true;
                    if (sameZone) {
                        if (prevPallet >= 1 && prevPallet <= destPallets.length) destPallets[prevPallet - 1] = false;
                        t.update(destZoneRef, { pallets: destPallets });
                    } else {
                        t.update(destZoneRef, { pallets: destPallets });
                        if (prevZoneDoc && prevZoneDoc.exists) {
                            const prevPallets = prevZoneDoc.data().pallets;
                            if (prevPallet >= 1 && prevPallet <= prevPallets.length) {
                                prevPallets[prevPallet - 1] = false;
                                t.update(prevZoneRef, { pallets: prevPallets });
                            }
                        }
                    }

                    t.update(occRef, { zone: destZone, palletNumber: destPallet });
                });

                await db.collection('movements').add({
                    type: 'Move', details: `Moved from ${prevZone} (Pallet ${prevPallet}) to ${destZone} (Pallet ${destPallet})`,
                    batch, container, zone: destZone, operator,
                    palletNumber: destPallet,
                    time: firebase.firestore.FieldValue.serverTimestamp()
                });

                document.getElementById('moveSourceSelect').selectedIndex = 0;
                document.getElementById('moveZoneSelect').selectedIndex = 0;
                document.getElementById('movePalletSelect').innerHTML = '<option value="" disabled selected>-- Choose Pallet --</option>';
                document.getElementById('moveOperatorInput').value = '';
            } catch (err) {
                alert('Could not move: ' + err.message);
            } finally {
                moveBtn.disabled = false;
                moveBtn.textContent = 'Confirm Move';
            }
        }

        // ---------- Camera Scanner ----------
        function startScanner() {
            document.getElementById('start-scan-btn').classList.add('hidden');
            document.getElementById('stop-scan-btn').classList.remove('hidden');
            const statusEl = document.getElementById('scan-status');
            statusEl.classList.remove('hidden');
            statusEl.textContent = 'Starting camera...';

            html5QrCode = new Html5Qrcode("reader");

            const config = { fps: 10, qrbox: { width: 250, height: 250 } };

            html5QrCode.start(
                { facingMode: "environment" },
                config,
                onScanSuccess,
                onScanFailure
            ).then(() => {
                statusEl.textContent = 'Point the camera at the QR code';
            }).catch((err) => {
                let msg = 'Camera error: ' + err;
                if (String(err).includes('NotAllowedError')) {
                    msg = 'Camera permission was blocked. Please allow camera access for this site in your browser settings, then try again.';
                } else if (String(err).includes('NotFoundError')) {
                    msg = 'No camera was found on this device.';
                }
                statusEl.textContent = msg;
                document.getElementById('start-scan-btn').classList.remove('hidden');
                document.getElementById('stop-scan-btn').classList.add('hidden');
            });
        }

        function stopScanner() {
            if (html5QrCode) {
                html5QrCode.stop().then(() => {
                    html5QrCode.clear();
                    document.getElementById('start-scan-btn').classList.remove('hidden');
                    document.getElementById('stop-scan-btn').classList.add('hidden');
                    document.getElementById('scan-status').classList.add('hidden');
                }).catch(() => {
                    document.getElementById('start-scan-btn').classList.remove('hidden');
                    document.getElementById('stop-scan-btn').classList.add('hidden');
                });
            }
        }

        function onScanFailure(error) {
            // Called continuously while no QR is found — ignore, this is normal.
        }

        function onScanSuccess(decodedText) {
            if (navigator.vibrate) navigator.vibrate(150);
            document.getElementById('batchInput').value = decodedText.trim();
            document.getElementById('containerInput').focus();
            stopScanner();
            const statusEl = document.getElementById('scan-status');
            statusEl.classList.remove('hidden');
            statusEl.textContent = 'QR captured ✔';
        }

        // ---------- Logging (with safe pallet assignment) ----------
        function occupancyKey(batch, container) {
            // Firestore doc IDs can't contain '/', and keeping it readable helps debugging.
            return `${batch}__${container}`.replace(/[\/\s]+/g, '_').slice(0, 500);
        }

        async function logMovement() {
            const zone = document.getElementById('zoneSelect').value;
            const batch = document.getElementById('batchInput').value.trim();
            const container = document.getElementById('containerInput').value.trim();
            const operator = document.getElementById('operatorInput').value.trim();

            if (!zone || !batch || !container || !operator) {
                alert('Please fill in all fields before logging.');
                return;
            }

            const confirmBtn = document.getElementById('confirmBtn');
            confirmBtn.disabled = true;
            confirmBtn.textContent = 'Saving...';

            try {
                let assignedPallet = null;
                let movementType = 'Entry';
                let movementDetails = 'New arrival';
                const occKey = occupancyKey(batch, container);
                const occRef = db.collection('occupancy').doc(occKey);

                // Transaction guarantees two employees can't grab the same pallet
                // even if they both hit Confirm at the exact same moment. It also
                // frees this batch/container's PREVIOUS pallet (if any) so zones
                // don't fill up permanently as containers move through the corridor.
                await db.runTransaction(async (t) => {
                    const occDoc = await t.get(occRef);
                    const prev = occDoc.exists ? occDoc.data() : null;

                    const newZoneRef = db.collection('zones').doc(zone);
                    const newZoneDoc = await t.get(newZoneRef);
                    if (!newZoneDoc.exists) throw new Error('Zone not found');

                    let prevZoneDoc = null;
                    const prevZoneRef = (prev && prev.zone && prev.zone !== zone)
                        ? db.collection('zones').doc(prev.zone)
                        : null;
                    if (prevZoneRef) prevZoneDoc = await t.get(prevZoneRef);

                    const newPallets = newZoneDoc.data().pallets;
                    const idx = newPallets.findIndex(p => p === false);
                    if (idx === -1) throw new Error('ZONE_FULL');
                    newPallets[idx] = true;
                    t.update(newZoneRef, { pallets: newPallets });
                    assignedPallet = idx + 1;

                    if (prevZoneRef && prevZoneDoc && prevZoneDoc.exists) {
                        const prevPallets = prevZoneDoc.data().pallets;
                        if (prev.palletNumber >= 1 && prev.palletNumber <= prevPallets.length) {
                            prevPallets[prev.palletNumber - 1] = false;
                            t.update(prevZoneRef, { pallets: prevPallets });
                        }
                        movementType = 'Move';
                        movementDetails = `Moved from ${prev.zone} (Pallet ${prev.palletNumber}) to ${zone} (Pallet ${assignedPallet})`;
                    } else if (prev && prev.zone === zone) {
                        // Same zone re-scan: free the old slot too, since we just took a new one.
                        if (prev.palletNumber >= 1 && prev.palletNumber <= newPallets.length && prev.palletNumber !== assignedPallet) {
                            newPallets[prev.palletNumber - 1] = false;
                            t.update(newZoneRef, { pallets: newPallets });
                            movementType = 'Move';
                            movementDetails = `Re-assigned within ${zone}: Pallet ${prev.palletNumber} → Pallet ${assignedPallet}`;
                        }
                    }

                    t.set(occRef, { batch, container, zone, palletNumber: assignedPallet });
                });

                await db.collection('movements').add({
                    type: movementType, details: movementDetails,
                    batch, container, zone, operator,
                    palletNumber: assignedPallet,
                    time: firebase.firestore.FieldValue.serverTimestamp()
                });

                document.getElementById('batchInput').value = '';
                document.getElementById('containerInput').value = '';
                document.getElementById('zoneSelect').selectedIndex = 0;

                const statusEl = document.getElementById('scan-status');
                statusEl.classList.remove('hidden');
                statusEl.textContent = `Logged to ${zone}, Pallet ${assignedPallet} ✔`;
            } catch (err) {
                if (err.message === 'ZONE_FULL') {
                    alert('That zone just became full (another employee filled the last pallet). Please pick a different zone.');
                } else {
                    alert('Error saving: ' + err.message);
                }
            } finally {
                confirmBtn.disabled = false;
                confirmBtn.textContent = 'Confirm & Log Container';
            }
        }

        // ---------- Table rendering ----------
        function renderLogs() {
            const tbody = document.getElementById('logTableBody');
            tbody.innerHTML = '';
            const typeStyles = {
                'Entry': 'bg-emerald-100 text-emerald-700',
                'Move': 'bg-[#0B1B33]/10 text-[#0B1B33]',
                'Release': 'bg-rose-100 text-rose-700'
            };
            logs.forEach(log => {
                const row = document.createElement('tr');
                row.className = 'border-t border-slate-100';
                const badgeClass = typeStyles[log.type] || 'bg-slate-100 text-slate-600';
                row.innerHTML = `
                    <td class="p-2"><span class="px-1.5 py-0.5 rounded text-[10px] font-semibold ${badgeClass}">${escapeHtml(log.type)}</span></td>
                    <td class="p-2">${escapeHtml(log.batch)}</td>
                    <td class="p-2">${escapeHtml(log.container)}</td>
                    <td class="p-2">${escapeHtml(log.zone)}</td>
                    <td class="p-2">${escapeHtml(String(log.palletNumber))}</td>
                    <td class="p-2 text-slate-500">${escapeHtml(log.details)}</td>
                    <td class="p-2">${escapeHtml(log.time)}</td>
                `;
                tbody.appendChild(row);
            });
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        // ---------- Search by Batch ----------
        function searchBatch() {
            const query = document.getElementById('searchBatchInput').value.trim().toLowerCase();
            const resultBox = document.getElementById('searchResult');

            if (!query) {
                resultBox.classList.add('hidden');
                resultBox.innerHTML = '';
                return;
            }

            const matches = logs.filter(l => l.batch.toLowerCase() === query);

            if (matches.length === 0) {
                resultBox.classList.remove('hidden');
                resultBox.innerHTML = `
                    <div class="bg-amber-50 border border-amber-200 text-amber-700 text-xs p-2.5 rounded-md">
                        No record found for batch "${escapeHtml(query)}".
                    </div>`;
                return;
            }

            const latest = matches[0]; // logs are already newest-first
            resultBox.classList.remove('hidden');

            if (latest.type === 'Release') {
                resultBox.innerHTML = `
                    <div class="bg-rose-50 border border-rose-200 p-2.5 rounded-md">
                        <p class="text-xs text-rose-700">
                            Batch <span class="font-bold">${escapeHtml(latest.batch)}</span> was <span class="font-bold">released</span> from
                            <span class="font-bold">${escapeHtml(latest.zone)}</span>, Pallet ${escapeHtml(String(latest.palletNumber))}
                        </p>
                        <p class="text-[11px] text-rose-600 mt-0.5">
                            ${escapeHtml(latest.details)} • ${escapeHtml(latest.time)} • By ${escapeHtml(latest.operator)}
                        </p>
                        ${matches.length > 1 ? `<p class="text-[11px] text-rose-500 mt-1">${matches.length} total movements found for this batch</p>` : ''}
                    </div>`;
            } else {
                resultBox.innerHTML = `
                    <div class="bg-emerald-50 border border-emerald-200 p-2.5 rounded-md">
                        <p class="text-xs text-emerald-700">
                            Batch <span class="font-bold">${escapeHtml(latest.batch)}</span> is currently in
                            <span class="font-bold">${escapeHtml(latest.zone)}</span>, Pallet ${escapeHtml(String(latest.palletNumber))}
                        </p>
                        <p class="text-[11px] text-emerald-600 mt-0.5">
                            Container: ${escapeHtml(latest.container)} • ${escapeHtml(latest.time)} • Logged by ${escapeHtml(latest.operator)}
                        </p>
                        ${latest.type === 'Move' ? `<p class="text-[11px] text-blue-600 mt-1">${escapeHtml(latest.details)}</p>` : ''}
                        ${matches.length > 1 ? `<p class="text-[11px] text-emerald-500 mt-1">${matches.length} total movements found for this batch</p>` : ''}
                    </div>`;
            }
        }

        // ---------- Export ----------
        // Reuses the already-loaded header <img> (same-origin, so canvas isn't tainted)
        // to get the logo as a data URL for the PDF watermark, without an extra fetch.
        function getLogoInfo() {
            return new Promise((resolve) => {
                const img = document.getElementById('companyLogo');
                if (!img || img.tagName !== 'IMG' || !img.complete || !img.naturalWidth) {
                    resolve(null);
                    return;
                }
                try {
                    const canvas = document.createElement('canvas');
                    canvas.width = img.naturalWidth;
                    canvas.height = img.naturalHeight;
                    canvas.getContext('2d').drawImage(img, 0, 0);
                    resolve({
                        dataUrl: canvas.toDataURL('image/png'),
                        aspect: img.naturalHeight / img.naturalWidth
                    });
                } catch (e) {
                    resolve(null); // logo not loaded yet / blocked — PDF still works, just without the watermark
                }
            });
        }

        // Builds and downloads a branded PDF from any array of log-shaped records.
        async function buildPDF(logsArray, filename) {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            const pageWidth = doc.internal.pageSize.getWidth();
            const pageHeight = doc.internal.pageSize.getHeight();
            const NAVY = [11, 27, 51];      // #0B1B33
            const GOLD = [242, 180, 41];     // #F2B429
            const CREAM = [245, 243, 239];   // #F5F3EF

            const logo = await getLogoInfo();

            // Draws the watermark + top header logo on every page (called via didDrawPage below).
            function drawPageChrome() {
                doc.setFillColor(255, 255, 255);
                doc.rect(0, 0, pageWidth, pageHeight, 'F');

                if (logo) {
                    const wmWidth = pageWidth * 0.65;
                    const wmHeight = wmWidth * logo.aspect;
                    try {
                        doc.saveGraphicsState();
                        doc.setGState(new doc.GState({ opacity: 0.16 }));
                        doc.addImage(logo.dataUrl, 'PNG', (pageWidth - wmWidth) / 2, (pageHeight - wmHeight) / 2, wmWidth, wmHeight);
                        doc.restoreGraphicsState();
                    } catch (e) {
                        console.warn('Watermark skipped:', e);
                    }

                    const headerHeight = 13;
                    const headerWidth = headerHeight / logo.aspect;
                    doc.addImage(logo.dataUrl, 'PNG', 14, 6, headerWidth, headerHeight);
                    doc.setFont(undefined, 'normal');
                    doc.setFontSize(9);
                    doc.setTextColor(90, 90, 90);
                    doc.text('Corridor Container Tracker — Movement Log', 14 + headerWidth + 4, 6 + headerHeight / 2 + 1.5);
                } else {
                    // Fallback if the logo image wasn't available to grab (e.g. not yet loaded on page)
                    doc.setFont(undefined, 'bold');
                    doc.setFontSize(16);
                    doc.setTextColor(...NAVY);
                    doc.text('EVA PHARMA', 14, 15);
                    doc.setFont(undefined, 'normal');
                    doc.setFontSize(10);
                    doc.setTextColor(90, 90, 90);
                    doc.text('Corridor Container Tracker — Movement Log', 14, 21);
                }

                doc.setDrawColor(...GOLD);
                doc.setLineWidth(0.8);
                doc.line(14, 22, pageWidth - 14, 22);
            }

            doc.autoTable({
                startY: 27,
                margin: { top: 27 },
                styles: { fontSize: 8, textColor: [30, 41, 59] },
                headStyles: { fillColor: NAVY, textColor: [255, 255, 255], fontStyle: 'bold' },
                alternateRowStyles: { fillColor: CREAM },
                head: [['Type', 'Batch', 'Container', 'Zone', 'Pallet', 'Details', 'Time']],
                body: logsArray.map(l => [l.type, l.batch, l.container, l.zone, l.palletNumber, l.details, l.time]),
                didParseCell: function (data) {
                    if (data.section === 'body' && data.column.index === 0) {
                        if (data.cell.raw === 'Entry') data.cell.styles.textColor = [4, 120, 87];
                        else if (data.cell.raw === 'Move') data.cell.styles.textColor = NAVY;
                        else if (data.cell.raw === 'Release') data.cell.styles.textColor = [190, 18, 60];
                    }
                },
                didDrawPage: drawPageChrome
            });

            doc.save(filename);
        }

        function buildCSV(logsArray, filename) {
            let csv = 'Type,Batch,Container,Zone,Pallet,Details,Operator,Time\n';
            logsArray.forEach(l => {
                const safe = (v) => `"${String(v).replace(/"/g, '""')}"`;
                csv += `${safe(l.type)},${safe(l.batch)},${safe(l.container)},${safe(l.zone)},${safe(l.palletNumber)},${safe(l.details)},${safe(l.operator)},${safe(l.time)}\n`;
            });
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            a.click();
            URL.revokeObjectURL(url);
        }

        // Converts a raw Firestore movements doc into the same shape used on-screen.
        function shapeMovementDoc(d) {
            const data = d.data();
            return {
                type: data.type || 'Entry',
                details: data.details || '',
                batch: data.batch || '',
                container: data.container || '',
                zone: data.zone || '',
                operator: data.operator || '',
                palletNumber: data.palletNumber || '',
                time: data.time && data.time.toDate ? data.time.toDate().toLocaleString() : 'Just now'
            };
        }

        // ---------- Exports of the on-screen list (most recent 300) ----------
        function exportPDF() {
            buildPDF(logs, 'container_log_recent300.pdf');
        }

        function exportCSV() {
            buildCSV(logs, 'container_log_recent300.csv');
        }

        // ---------- Full history exports (fetches EVERY movement, no cap) ----------
        async function fetchAllMovements() {
            const snapshot = await db.collection('movements').orderBy('time', 'desc').get();
            return snapshot.docs.map(shapeMovementDoc);
        }

        async function fullHistoryExportPDF() {
            const btn = document.getElementById('fullHistoryPdfBtn');
            const original = btn.textContent;
            btn.disabled = true;
            btn.textContent = 'Loading full history...';
            try {
                const allLogs = await fetchAllMovements();
                await buildPDF(allLogs, 'container_log_FULL_HISTORY.pdf');
            } catch (err) {
                alert('Could not export full history: ' + err.message);
            } finally {
                btn.disabled = false;
                btn.textContent = original;
            }
        }

        async function fullHistoryExportCSV() {
            const btn = document.getElementById('fullHistoryCsvBtn');
            const original = btn.textContent;
            btn.disabled = true;
            btn.textContent = 'Loading...';
            try {
                const allLogs = await fetchAllMovements();
                buildCSV(allLogs, 'container_log_FULL_HISTORY.csv');
            } catch (err) {
                alert('Could not export full history: ' + err.message);
            } finally {
                btn.disabled = false;
                btn.textContent = original;
            }
        }

        // Boot the app
        initFirebase();
    </script>
</body>
